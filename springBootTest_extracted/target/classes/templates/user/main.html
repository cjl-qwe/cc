<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Microsoft YaHei", "PingFang SC", Helvetica, Arial, sans-serif;
            color: #1f2937;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 55%, #e0f2fe 100%);
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 34px 30px 28px;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .10), 0 2px 6px rgba(15, 23, 42, .06);
        }

        .avatar {
            width: 62px;
            height: 62px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border-radius: 50%;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
            font-weight: 600;
            color: #111827;
        }

        .hi { color: #4f46e5; }

        .subtitle {
            margin: 0 0 24px;
            font-size: 13px;
            color: #6b7280;
        }

        dl {
            margin: 0 0 24px;
            padding: 16px 18px;
            text-align: left;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        dl > div {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            font-size: 13px;
            line-height: 2;
        }

        dt { color: #6b7280; }
        dd { margin: 0; color: #111827; font-weight: 500; }

        .actions { display: flex; gap: 10px; }

        a.btn {
            flex: 1;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            transition: filter .16s, background .16s;
        }

        a.primary {
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        a.primary:hover { filter: brightness(1.06); }

        a.ghost {
            color: #4b5563;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
        }

        a.ghost:hover { background: #e9ebef; }
    </style>
</head>
<body>
<div class="card">
    <div class="avatar" th:text="${#strings.substring(username, 0, 1)}">?</div>

    <h2>欢迎回来，<span class="hi" th:text="${username}">用户名</span></h2>
    <p class="subtitle">你已成功登录 springBootTest</p>

    <dl>
        <div>
            <dt>用户名</dt>
            <dd th:text="${username}">-</dd>
        </div>
        <div>
            <dt>密码</dt>
            <dd>******（出于安全考虑不展示）</dd>
        </div>
        <div>
            <dt>登录状态</dt>
            <dd>已登录</dd>
        </div>
    </dl>

    <div class="actions">
        <a class="btn primary" href="/index.html">返回首页</a>
        <a class="btn ghost" href="/user/to_login">退出登录</a>
    </div>
</div>
</body>
</html>
